services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore_local_password
      POSTGRES_DB: fincore
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fincore:fincore_local_password@postgres:5432/fincore?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
  analytics:
    build: ./analytics
    ports: ["8000:8000"]
volumes:
  pgdata:
